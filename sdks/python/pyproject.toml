[project]
name = "spendfirewall"
version = "0.1.0"
description = "Route OpenAI-compatible LLM calls through a Spend Firewall gateway, with per-session budgets and kill switches."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
openai = ["openai>=1.40"]
dev = ["pytest>=8", "openai>=1.40"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["spendfirewall*"]
