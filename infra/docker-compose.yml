# From the repo root:  docker compose -f infra/docker-compose.yml up --build
services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    ports: ["8080:8080"]
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+asyncpg://firewall:firewall@postgres:5432/firewall
    depends_on:
      redis: {condition: service_started}
      postgres: {condition: service_healthy}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: firewall
      POSTGRES_PASSWORD: firewall
      POSTGRES_DB: firewall
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U firewall"]
      interval: 2s
      retries: 20
  # Fake OpenAI for demos and load tests: set UPSTREAM_OVERRIDE_BASE_URL=http://mock-provider:9000/v1
  mock-provider:
    build:
      context: ..
      dockerfile: examples/mock-provider/Dockerfile
    ports: ["9000:9000"]
  dashboard:
    build:
      context: ../dashboard
    ports: ["5173:80"]
    profiles: ["ui"]
